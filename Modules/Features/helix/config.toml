theme = "base16_custom"

[editor]
shell = [ "fish", "-c" ]
default-yank-register = "+"
line-number = "relative"
indent-guides = { render = true, character = "│" }
rulers = [ 20, 40, 60, 80 ]
bufferline = "multiple"
auto-format = true
rainbow-brackets = true
color-modes = true
cursorline = true
cursorcolumn = false
scrolloff = 3
completion-timeout = 100
trim-final-newlines = true
default-line-ending = "lf"
# Max Width A Single Line Can Have By Number Of Characters.
# text-width = 80

[editor.cursor-shape]
normal = "block"
insert = "block"
select = "block"

[editor.file-picker]
# Set To True To See Hidden Files In Picker.
hidden = true

[editor.soft-wrap]
enable = true
# max-wrap = 20
# max-indent-retain = 40
# wrap-at-text-width = false

[editor.gutters.line-numbers]
min-width = 0

[keys.normal]
X = "extend_line_above"

[keys.normal.space]
f = "file_picker_in_current_directory"
F = "file_picker"

