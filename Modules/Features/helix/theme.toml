inherits = "base16_terminal"

"ui.cursorcolumn.primary" = { bg = "five" }
# "ui.cursor" = {}
# "ui.cursor.normal" = {}
# "ui.cursor.insert" = {}
# "ui.cursor.select" = {}
# "ui.cursor.match" = {}
# "ui.cursor.primary" = {}
# "ui.cursor.primary.normal" = {}
# "ui.cursor.primary.insert" = {}
# "ui.cursor.primary.select" = {}
# "ui.linenr" = Line numbers
# "ui.linenr.selected" = Line number for the line the cursor is on
# "ui.debug.breakpoint" = Breakpoint indicator, found in the gutter
# "ui.debug.active" = Indicator for the line at which debugging execution is paused at, found in the gutter
# "ui.gutter" = Gutter
# "ui.gutter.selected" = Gutter for the line the cursor is on
# "ui.statusline" = Statusline
# "ui.statusline.inactive" = Statusline (unfocused document)
# "ui.statusline.normal" = Statusline mode during normal mode (only if editor.color-modes is ena"bled)
# "ui.statusline.insert" = Statusline mode during insert mode (only if editor.color-modes is ena"bled)
# "ui.statusline.select" = Statusline mode during select mode (only if editor.color-modes is ena"bled)
# "ui.statusline.separator" = Separator character in statusline
# "ui.bufferline" = Style for the buffer line
# "ui.bufferline.active" = Style for the active buffer in buffer line
# "ui.bufferline.background" = Style for bufferline background
# "ui.popup" = Documentation popups (e.g. Space + k)
# "ui.popup.info" = Prompt for multiple key options
# "ui.picker.header" = Header row area in pickers with multiple columns
# "ui.picker.header.column" = Column names in pickers with multiple columns
# "ui.picker.header.column.active" = The column name in pickers with multiple columns where the "cursor is entering into.
# "ui.window" = Borderlines separating splits
# "ui.help" = Description box for commands
# "ui.text" = Default text style, command prompts, popup text, etc.
# "ui.text.focus" = The currently selected line in the picker
# "ui.text.inactive" = Same as ui.text but when the text is inactive (e.g. suggestions)
# "ui.text.info" = The key: command text in ui.popup.info boxes
# "ui.text.directory" = Directory names in prompt completion
# "ui.virtual.ruler" = Ruler columns (see the editor.rulers config)
# "ui.virtual.whitespace" = Visible whitespace characters
# "ui.virtual.indent-guide" = Vertical indent width guides
# "ui.virtual.inlay-hint" = Default style for inlay hints of all kinds
# "ui.virtual.inlay-hint.parameter" = Style for inlay hints of kind parameter (language servers a"re not required to set a kind)
# "ui.virtual.inlay-hint.type" = Style for inlay hints of kind type (language servers are not re"quired to set a kind)
# "ui.virtual.wrap" = Soft-wrap indicator (see the editor.soft-wrap config)
# "ui.virtual.jump-label" = Style for virtual jump labels
# "ui.menu" = Code and command completion menus
# "ui.menu.selected" = Selected autocomplete item
# "ui.menu.scroll" = fg sets thumb color, bg sets track color of scrollbar
# "ui.selection" = For selections in the editing area
# "ui.selection.primary" =	
# "ui.highlight" = Highlighted lines in the picker preview
# "ui.highlight.frameline" = Line at which debugging execution is paused at
# "ui.cursorline.primary" = The line of the primary cursor (if cursorline is enabled)
# "ui.cursorline.secondary" = The lines of any other cursors (if cursorline is enabled)
# "ui.cursorcolumn.primary" = The column of the primary cursor (if cursorcolumn is enabled)
# "ui.cursorcolumn.secondary" = The columns of any other cursors (if cursorcolumn is enabled)
# "warning" = Diagnostics warning (gutter)
# "error" = Diagnostics error (gutter)
# "info" = Diagnostics info (gutter)
# "hint" = Diagnostics hint (gutter)
# "diagnostic" = Diagnostics fallback style (editing area)
# "diagnostic.hint"	Diagnostics hint (editing area)
# "diagnostic.info"	Diagnostics info (editing area)
# "diagnostic.warning" = Diagnostics warning (editing area)
# "diagnostic.error" = Diagnostics error (editing area)
# "diagnostic.unnecessary" = Diagnostics with unnecessary tag (editing area)
# "diagnostic.deprecated" =	Diagnostics with deprecated tag (editing area)
# "tabstop"	= Snippet placeholder

[palette]
dark-charcoal = "#161616"
orange-red = "#f06449"
neon-green = "#00c853"
gold = "#fadb14"
electric-blue = "#2551fe"
magenta-red = "#f02e6b"
cyan = "#00d8b6"
slate-grey = "#45475a"
mint-green = "#00e676"
