format = '[Root](bold yellow)[@](bold red)[NixOS](bold blue)[:](bold red)$directory$git_branch${custom.jj}$git_status$nix_shell$package$python$rust[\]](bold yellow)[‡](bold red) $character$status'

[character]
success_symbol = "[❯](bold blue)"
error_symbol   = "[❯](bold red)"
disabled       = false

[directory]
style                     = "bold green"
truncation_length         = 3
fish_style_pwd_dir_length = 1

# Git branch appearance
[git_branch]
disabled      = true
only_attached = false
symbol        = "🌿 "
style         = "bold purple"
format        = "on [$symbol$branch]($style) "

# Git status emojis
[git_status]
conflicted = "💥"
ahead      = "🚀"
behind     = "🐢"
diverged   = "🔱"
untracked  = "🤷"
staged     = "📦"
modified   = "📝"
renamed    = "🚚"
deleted    = "🗑️"
format     = '([\[$all_status$ahead_behind\]]($style) )'
style      = "bold red"

[custom.jj]
command = '''jj log -r @ --no-graph -T 'local_bookmarks.join(", ")' '''
when    = "test -d .jj"
style   = "bold purple"
format  = "on [$symbol$output]($style) "
symbol  = "🌿 "

# Python language indicator
[python]
symbol   = "🐍 "
style    = "bold yellow"
disabled = false
format   = "via [$symbol$version]($style) "

# Rust language indicator
[rust]
symbol   = "🦀 "
style    = "bold red"
disabled = false
format   = "via [$symbol$version]($style) "

[nix_shell]
disabled = false
symbol   = "❄️ "
style    = "bold blue"
format   = "via [$symbol$state$name]($style) "

[status]
disabled = false
format   = '[\[$int\]](bold red) '
